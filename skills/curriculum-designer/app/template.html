<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drawing-set index down the left (the course's "sheets"), one working sheet on the right. */
:root {
  --paper: #eef1ee;
  --sheet: #fbfcfa;
  --ink: #18262b;
  --ink-2: #4a5a5f;
  --rule: #cfd8d4;
  --accent: #2446b8;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8fa;
  --e: #1f7a5a; --e-soft: #dcefe6;
  --h: #9a6200; --h-soft: #f6ead2;
  --v: #6b3fa8; --v-soft: #ece3f7;
  --bad: #b3261e; --bad-soft: #f8e1df;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
    --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
    --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
    --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
  --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
  --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
  --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--rule); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r); color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.35; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--ink); color: var(--paper); }
.nav a.on .label, .nav a.on .tick { color: var(--paper); }
.nav .num { font-family: var(--mono); font-size: .75rem; color: var(--ink-2); }
.nav a.on .num { color: var(--paper); }
.tick { font-family: var(--mono); font-size: .75rem; color: var(--e); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup > .label { padding: 0 8px 4px; }
.sync { padding: 0 8px; font-size: .8rem; }

main { padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 56px); min-width: 0; }
.sheet { max-width: 780px; display: flex; flex-direction: column; gap: 28px; }
.sheet.wide { max-width: 1080px; }
.head { display: flex; flex-direction: column; gap: 10px; }
.titleblock { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--mono); font-size: .75rem; color: var(--ink-2); letter-spacing: .04em; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 6px 0; }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 64ch; }

.step { display: flex; flex-direction: column; gap: 12px; }
.step > .label { display: flex; gap: 10px; align-items: center; }
.step > .label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.prose h4 { font-family: var(--body); font-size: 1rem; margin: 6px 0 0; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.attempt { border-style: dashed; border-color: var(--accent); }
.idea { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.idea > summary { cursor: pointer; list-style: none; padding: 14px 20px; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.idea > summary::-webkit-details-marker { display: none; }
.idea > summary h3 { font-size: 1.12rem; }
.idea[open] > summary { border-bottom: 1px solid var(--rule); }
.idea .prose { padding: 16px 20px 20px; }

.tag { font-family: var(--mono); font-size: .7rem; font-weight: 500; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.tag.E { background: var(--e-soft); color: var(--e); }
.tag.H { background: var(--h-soft); color: var(--h); }
.tag.V { background: var(--v-soft); color: var(--v); }

.btn { border: 1px solid var(--ink); background: transparent; border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: .82rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
textarea, input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; line-height: 1.5; }
textarea { min-height: 130px; resize: vertical; }
.saved { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }

.hinge { display: flex; flex-direction: column; gap: 10px; }
.hinge .q { font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--mono); color: var(--ink-2); }
.opt.right { border-color: var(--e); background: var(--e-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.diag { font-size: .93rem; padding: 10px 12px; border-left: 3px solid var(--ink-2); background: var(--paper); }
.diag.right { border-color: var(--e); }
.diag.wrong { border-color: var(--bad); }

.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; }
.steps li::marker { font-family: var(--mono); color: var(--ink-2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); min-width: 0; }
a.tile:hover { border-color: var(--accent); }
.tile .big { font-family: var(--display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.modlist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.modrow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 14px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.modrow:hover { background: var(--sheet); }
.modrow .num { font-family: var(--display); font-size: 1.4rem; color: var(--ink-2); }
.modrow .t { font-weight: 700; }
.modrow .meta { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); text-align: right; }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 28px; min-height: 240px; display: flex; flex-direction: column; gap: 16px; }
.card .front { font-family: var(--display); font-size: 1.35rem; line-height: 1.35; }
.card .back { border-top: 1px dashed var(--rule); padding-top: 16px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades .btn { display: flex; flex-direction: column; align-items: center; gap: 0; }
.grades .btn small { font-weight: 400; font-family: var(--mono); font-size: .7rem; color: var(--ink-2); }

.bands { display: flex; flex-direction: column; gap: 14px; }
.band { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.band header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.node { border: 1px solid var(--rule); background: var(--paper); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 8px; align-items: center; }
.node.on { border-color: var(--accent); background: var(--accent-soft); }
.node.linked { border-color: var(--accent); }
.loop { font-size: .95rem; padding: 12px 14px; border: 1.5px dashed var(--accent); border-radius: var(--r); }

.tension { display: flex; flex-direction: column; gap: 10px; }
.poles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.poles > div { background: var(--paper); border-radius: var(--r); padding: 10px 12px; font-size: .93rem; min-width: 0; }
.rule { font-weight: 700; border-left: 3px solid var(--accent); padding-left: 12px; }

.entry { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.tagpick { display: flex; gap: 4px; }
.tagpick button { border: 1px solid var(--rule); background: transparent; border-radius: 99px; font-family: var(--mono); font-size: .72rem; padding: 2px 8px; cursor: pointer; }
.tagpick button.on.E { background: var(--e-soft); color: var(--e); border-color: var(--e); }
.tagpick button.on.H { background: var(--h-soft); color: var(--h); border-color: var(--h); }
.tagpick button.on.V { background: var(--v-soft); color: var(--v); border-color: var(--v); }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 1.1rem; line-height: 1; }

.fb { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.dstmt { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.conf { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.conf button, .tf button { border: 1px solid var(--rule); background: transparent; border-radius: var(--r); padding: 3px 10px; cursor: pointer; font-family: var(--mono); font-size: .8rem; }
.conf button.on, .tf button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.mtop { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; position: fixed; inset: 0; z-index: 20; background: var(--paper); height: 100%; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .rail.open { display: flex; }
  .mtop { display: flex; justify-content: space-between; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 10px 16px; }
  .mtop b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
  .poles { grid-template-columns: minmax(0,1fr); }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="mtop"><b>{{TITLE}}</b><button class="btn small" id="menuBtn" aria-controls="rail" aria-expanded="false">Index</button></div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Course index"></nav>
  <main id="main"></main>
</div>

<script type="application/json" id="course-data">/*__DATA__*/</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const C = DATA.course || {};
const MODULES = DATA.modules || [];
const TAGS = Object.assign({ E: "supported by evidence", H: "hypothesis to test", V: "value commitment" }, C.tags || {});
const CARDS = DATA.cards || [];
const CASES = DATA.cases || [];
const TENSIONS = DATA.tensions || [];
const BRIEF = DATA.brief || [];
const MODEL = DATA.model || { bands: [] };
const DIAG = DATA.diagnostic || [];
const DAY = 86400000;

/* ---------- state + persistence ---------- */
const blank = () => ({ v: 1, updatedAt: 0, started: Date.now(), modules: {}, cards: {}, cases: {}, brief: {}, diag: [] });
let S = blank();
const LS_KEY = (C.slug || "course") + "-state";
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let db = null, stateRef = null, syncNote = "Saved in this browser";
let writing = false, pending = false, timer = null;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!stateRef) return;
  clearTimeout(timer);
  timer = setTimeout(flush, 1200);
}
async function flush() {
  if (!stateRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await stateRef.set(JSON.parse(JSON.stringify(S))); syncNote = "Synced to your account"; }
  catch (e) { syncNote = e && e.code === "quota_exceeded" ? "Account storage is full; saved in this browser" : "Saved in this browser (sync paused)"; }
  writing = false;
  renderSync();
  if (pending) { pending = false; flush(); }
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d;
    stateRef = db.doc("data/users/" + id + "/state");
    const snap = await stateRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} route(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flush();
    } else if (S.updatedAt) flush();
    syncNote = "Synced to your account";
    renderSync();
  } catch (e) { /* stay local */ }
}

/* ---------- Claude mentor ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
const SAMPLE_MSG = {
  not_granted: "Mentor feedback is turned off for this page.", sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "Too many requests just now. Try again in a minute.", session_expired: "Sign in to claude.ai again, then retry.",
  prompt_too_large: "That was too long to send. Shorten your answer and retry.", refused: "Claude declined this one. Rephrase and retry."
};
async function mentorViaEndpoint(outEl, btn, prompt) {
  // Self-hosted mode: POST the prompt to your own server, which calls the Claude API and streams
  // plain text back (see scripts/mentor-proxy.mjs). Nothing else leaves the browser.
  btn.disabled = true; outEl.hidden = false; outEl.textContent = "Thinking...";
  try {
    const r = await fetch(C.mentor_endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let text = "";
    for (;;) { const { value, done } = await reader.read(); if (done) break; text += dec.decode(value, { stream: true }); outEl.innerHTML = md(text); }
    if (!text) outEl.textContent = "No reply.";
  } catch (e) { outEl.innerHTML = "<p class='muted'>" + esc("Couldn't reach the mentor service (" + (e && e.message || e) + ").") + "</p>"; }
  finally { btn.disabled = false; }
}
async function mentor(outEl, btn, prompt) {
  if (C.mentor_endpoint && !(window.claude && window.claude.use)) return mentorViaEndpoint(outEl, btn, prompt);
  const sample = await getSample();
  if (!sample) { outEl.hidden = false; outEl.textContent = "Mentor feedback works when this page is opened on claude.ai, or when the course is hosted with a mentor endpoint."; return; }
  btn.disabled = true; outEl.hidden = false; outEl.textContent = "Thinking...";
  try {
    await sample(prompt, { modelTier: "default", cache: false, onText: ({ text }) => { outEl.innerHTML = md(text); } });
  } catch (e) {
    if (e && e.code === "cancelled") return;
    outEl.innerHTML = (e && e.text ? md(e.text) + "<p class='muted'>(interrupted)</p>" : "") + "<p class='muted'>" + esc(SAMPLE_MSG[e && e.code] || "Couldn't reach Claude. Try again.") + "</p>";
  } finally { btn.disabled = false; }
}
const MENTOR_VOICE = C.mentor_voice || "You are a demanding but supportive mentor (high standards, high support). Be specific and concise (under 250 words). Use markdown bullets. Tag claims as [E] evidence, [H] hypothesis, [V] value where useful.";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
          .replace(/\[(E|H|V)\]/g, '<span class="tag $1">$1</span>');
}
function md(src) {
  const lines = esc(src || "").split(/\n/);
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeL = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { flushP(); closeL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); closeL(); out += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^[-*]\s+(.*)/))) { flushP(); if (list !== "ul") { closeL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { closeL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL();
  return out;
}
const tagChip = t => t ? `<span class="tag ${esc(t)}" title="${esc(TAGS[t] || "")}">${esc(t)}</span>` : "";
const modState = id => (S.modules[id] = S.modules[id] || { hinge: {}, attempt: "", brief: "", done: false });
const L = "ABCDEFGH";
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const saveSoon = debounce(save, 600);
function bookName(slug) {
  const s = String(slug).replace(/^books\//, "").replace(/\.md.*$/, "").replace(/^\d+-/, "").replace(/-/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- SRS (SM-2 lite) ---------- */
function cardState(id) { return S.cards[id]; }
function dueCards() {
  const now = Date.now();
  const unlocked = new Set(MODULES.filter(m => modState(m.id).done || m.id === "m0").map(m => m.id));
  const seen = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= now);
  const fresh = CARDS.filter(c => !S.cards[c.id] && unlocked.has(c.module));
  const newToday = Object.values(S.cards).filter(c => c.firstSeen && now - c.firstSeen < DAY).length;
  return seen.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).concat(fresh.slice(0, Math.max(0, 20 - newToday)));
}
function grade(id, g) {
  const now = Date.now();
  const c = S.cards[id] || { ease: 2.5, interval: 0, reps: 0, firstSeen: now, lapses: 0 };
  if (g === 0) { c.reps = 0; c.lapses++; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = now + 10 * 60000; }
  else {
    c.reps++;
    if (c.reps === 1) c.interval = g === 3 ? 3 : 1;
    else if (c.reps === 2) c.interval = g === 3 ? 7 : 3;
    else c.interval = Math.round(c.interval * c.ease * (g === 1 ? 0.6 : g === 3 ? 1.3 : 1));
    c.ease = Math.max(1.3, c.ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0));
    c.due = now + c.interval * DAY;
  }
  S.cards[id] = c; save();
}

      ${st.revealed ? `<section class="step reveal"><span class="label">Considerations</span><div class="prose"><ul>${(k.considerations || []).map(c => `<li>${inline(esc(c))}</li>`).join("")}</ul></div>
        <span class="label">Model answer</span><div class="prose">${md(k.model_answer)}</div>
        ${(k.sources || []).length ? `<p class="label">${k.sources.map(bookName).map(esc).join(" &middot; ")}</p>` : ""}</section>` : ""}
    </div>`;
  }
  return `<div class="sheet"><header class="head"><span class="label">${CASES.length} ${esc(C.case_noun || "cases")}</span><h1>Casebook</h1>
    <p class="lede">${esc(C.case_lede || "Realistic situations you will hit.")} Commit to a decision in writing before you look at the model answer.</p></header>
    <div class="modlist">${CASES.map((k, i) => { const t = TENSIONS.find(x => x.id === k.tension); const st = S.cases[k.id];
      return `<a class="modrow" href="#cases" data-case="${esc(k.id)}"><span class="num">${i + 1}</span><span><span class="t">${esc(k.title)}</span><br><span class="muted">${t ? esc(t.name) : ""}</span></span><span class="meta">${st && st.answer ? "answered" : ""}</span></a>`; }).join("")}</div></div>`;
}
function bindCases() {
  document.querySelectorAll("[data-case]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openCase = a.dataset.case; route(); window.scrollTo(0, 0); }));
  const back = $("#backCases"); if (back) back.addEventListener("click", () => { openCase = null; route(); });
  if (!openCase) return;
  const k = CASES.find(c => c.id === openCase), st = S.cases[k.id];
  $("#case-ans").addEventListener("input", e => { st.answer = e.target.value; saveSoon(); });
  $("#reveal").addEventListener("click", () => { st.revealed = !st.revealed; save(); route(); });
  $("#caseFb").addEventListener("click", e => {
    if (!st.answer.trim()) { const o = $("#case-out"); o.hidden = false; o.textContent = "Write your decision first."; return; }
    mentor($("#case-out"), e.currentTarget, `${MENTOR_VOICE}

Evaluate the learner's decision on this ${C.case_singular || "case"} against the model answer. Say what they got right, what they missed (especially evidence they ignored or values they left implicit), whether their [E]/[H]/[V] tags are honest, and give one sharper version of their decision in 2-3 sentences. Don't restate the whole model answer.

Case: ${k.title}
${k.scenario}
Question: ${k.question}
Considerations: ${(k.considerations || []).join("; ")}
Model answer: ${k.model_answer}

Learner's answer:
${st.answer}`);
  });
}

function viewDiagnostic() {
  const runs = S.diag || [];
  const cur = S._diagDraft = S._diagDraft || {};
  const complete = DIAG.every(d => cur[d.id] && cur[d.id].a != null && cur[d.id].c);
  const last = runs[runs.length - 1], first = runs[0];
  const score = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a === d.correct).length;
  const overconf = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a !== d.correct && r.answers[d.id].c >= 4).length;
  const results = last ? `<section class="panel reveal"><span class="label">Last run &middot; ${new Date(last.at).toLocaleDateString()}</span>
      <h3>${score(last)} of ${DIAG.length} right &middot; ${overconf(last)} confident mistakes</h3>
      ${runs.length > 1 ? `<p class="muted">First run: ${score(first)} right, ${overconf(first)} confident mistakes.</p>` : ""}
      <div class="prose"><ul>${DIAG.map(d => { const a = last.answers[d.id]; const ok = a && a.a === d.correct;
        return `<li><strong>${ok ? "Right" : "Wrong"}${a ? ", confidence " + a.c : ""}:</strong> ${inline(esc(d.statement))} <em>(${d.correct ? "true" : "false"})</em><br><span class="muted">${inline(esc(d.explanation))}${d.folk_theory && !ok ? " Folk theory: " + inline(esc(d.folk_theory)) : ""}</span></li>`; }).join("")}</ul></div></section>` : "";
  return `<div class="sheet"><header class="head"><span class="label">Take it on day 1 and again at the end</span><h1>Diagnostic</h1>
    <p class="lede">True or false, then how sure you are. Confident mistakes matter most: they are intuitive theories, and the course is built to change them.</p></header>
    ${results}
    <section class="step"><span class="label">${runs.length ? "Retake" : "Take the diagnostic"}</span>
    ${DIAG.map((d, i) => { const a = cur[d.id] || {}; return `<div class="dstmt"><p><span class="label">${i + 1}.</span> ${inline(esc(d.statement))}</p>
      <div class="row"><div class="tf">${[["True", true], ["False", false]].map(([l, v]) => `<button class="${a.a === v ? "on" : ""}" data-d="${esc(d.id)}" data-a="${v}">${l}</button>`).join(" ")}</div>
      <div class="conf"><span class="label">Sure?</span>${[1, 2, 3, 4, 5].map(c => `<button class="${a.c === c ? "on" : ""}" data-d="${esc(d.id)}" data-c="${c}" aria-label="Confidence ${c}">${c}</button>`).join("")}</div></div></div>`; }).join("")}
    <div class="row"><button class="btn primary" id="scoreDiag" ${complete ? "" : "disabled"}>Score it</button><span class="muted">${complete ? "" : "Answer every item and rate your confidence."}</span></div></section></div>`;
}
function bindDiagnostic() {
  const cur = S._diagDraft;
  document.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).a = b.dataset.a === "true"; save(); route(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).c = +b.dataset.c; save(); route(); }));
  $("#scoreDiag").addEventListener("click", () => { S.diag.push({ at: Date.now(), answers: cur }); S._diagDraft = {}; save(); route(); window.scrollTo(0, 0); });
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || "#home").slice(1);
  const main = $("#main"); const y = window.scrollY;
  const m = MODULES.find(x => x.id === h);
  if (m) { main.innerHTML = viewModule(m); bindModule(m); }
  else if (h === "cards") { main.innerHTML = viewCards(); bindCards(); }
  else if (h === "brief") { main.innerHTML = viewBrief(); bindBrief(); }
  else if (h === "model") { main.innerHTML = viewModel(); bindModel(); }
  else if (h === "tensions") { main.innerHTML = viewTensions(); }
  else if (h === "cases") { main.innerHTML = viewCases(); bindCases(); }
  else if (h === "diagnostic") { main.innerHTML = viewDiagnostic(); bindDiagnostic(); }
  else { main.innerHTML = viewHome(); }
  renderNav(m ? m.id : (h || "home"));
  if (route.last === h) window.scrollTo(0, y); else window.scrollTo(0, 0);
  route.last = h;
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
}
window.addEventListener("hashchange", () => { if (location.hash !== "#cases") openCase = null; cardQueue = []; showBack = false; route(); });
$("#menuBtn").addEventListener("click", () => { const r = $("#rail"); r.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(r.classList.contains("open"))); });
route();
connect();
})();
</script>
